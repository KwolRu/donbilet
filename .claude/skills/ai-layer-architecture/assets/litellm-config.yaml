# Шаблон конфигурации шлюза моделей (LiteLLM Proxy).
#
# ПРИНЦИП: бизнес-код знает ТОЛЬКО логические алиасы (<app>-default / -fast / -fallback).
# Физические модели меняются правкой ЭТОГО файла без изменений в сервисах — в этом смысл слоя.
#
# Замена <app> на префикс проекта — обязательна: алиасы попадают в БД (реестр моделей,
# маршрутные политики) и в журнал, и «leadmap-default» в чужом проекте будет вводить в
# заблуждение.
#
# Ключи провайдеров — ТОЛЬКО из окружения (`os.environ/...`), в этот файл и в git не попадают.

model_list:
  # ── default: интерактивные агентные задачи ────────────────────────────────────
  # Требования: tools + structured output, СТАБИЛЬНОСТЬ важнее пиковой силы.
  # НЕ ставить сюда free-tier модель общего пула: регулярные upstream-429 дают лишний
  # retry→fallback и латентность на каждом запросе.
  - model_name: <app>-default
    litellm_params:
      model: openrouter/google/gemini-3.7-flash
      api_key: os.environ/OPENROUTER_API_KEY

  # ── fast: высокочастотные лёгкие задачи и СТРОГИЙ JSON ────────────────────────
  # Reasoning-модели нестабильны на строгом structured output с tools (искажают enum,
  # опускают поля, зацикливают tool-loop) — генеративные и schema-задачи маршрутизировать сюда.
  - model_name: <app>-fast
    litellm_params:
      model: openrouter/openai/gpt-5.6-luna
      api_key: os.environ/OPENROUTER_API_KEY

  # ── fallback #1: ДРУГАЯ provider-семья, чем default и fast ────────────────────
  # Каскад внутри одного вендора не спасает: его сбой кладёт всю цепочку сразу.
  - model_name: <app>-fallback
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY

  # ── fallback #2: сильнее первого резерва, та же семья ─────────────────────────
  - model_name: <app>-fallback-2
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY

  # ── fallback #3: ещё одна семья. ВНИМАНИЕ: structured output может НЕ поддерживаться —
  # такой резерв годится для tool-calling/текста, но не для строгих JSON-задач.
  - model_name: <app>-fallback-3
    litellm_params:
      model: openrouter/qwen/qwen3.7-flash
      api_key: os.environ/OPENROUTER_API_KEY

  # ── batch: асинхронные массовые прогоны, eval, обогащение (дешевле, латентность не важна)
  - model_name: <app>-batch
    litellm_params:
      model: openrouter/google/gemini-3.7-flash:batch
      api_key: os.environ/OPENROUTER_API_KEY

  # ── embeddings: ОБЯЗАТЕЛЬНО завести здесь, если планируется retrieval.
  # Прямой вызов провайдера ради эмбеддингов — то же нарушение, что и ради генерации.
  # - model_name: <app>-embed
  #   litellm_params:
  #     model: openai/text-embedding-3-small
  #     api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true          # молча отбрасывать параметры, не поддержанные upstream
  num_retries: 2             # retry на транзиентных ошибках
  request_timeout: 60        # секунд; должен быть БОЛЬШЕ таймаута инструмента и МЕНЬШЕ таймаута задачи
  # Каскад деградации: разные семьи по порядку.
  fallbacks:
    - <app>-default: ["<app>-fallback", "<app>-fallback-2", "<app>-fallback-3"]

general_settings:
  # master_key — только из окружения. Неавторизованные запросы отклоняются.
  master_key: os.environ/LITELLM_MASTER_KEY

# ── ЧТО ПРОВЕРИТЬ ПОСЛЕ ПРАВКИ ────────────────────────────────────────────────────
# 1. GET /health/liveliness → 200; GET /v1/models содержит все алиасы.
# 2. Прогнать задачу и убедиться, что в журнале физическая модель = ожидаемый upstream
#    (тело ответа содержит АЛИАС — физическая модель приходит в ЗАГОЛОВКЕ).
# 3. Тест платформенности: сменить маршрут use case на другой алиас ОДНОЙ строкой в БД,
#    повторить задачу, убедиться что upstream сменился, а код не менялся.
# 4. Проверить резервные модели на поддержку structured output ДО того, как они понадобятся.
