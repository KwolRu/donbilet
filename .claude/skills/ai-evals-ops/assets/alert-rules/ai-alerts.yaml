# ШАБЛОН: правила алертов AI-контура (Prometheus/Alertmanager-совместимый формат).
#
# ПОРОГИ НИЖЕ — СТАРТОВЫЕ. Единственный правильный порог — посчитанный по своему трафику
# за 2 недели. Но начинать с чего-то нужно, иначе алертов не будет вообще.
#
# Требуются метрики (см. references/observability.md):
#   ai_task_total{task_type,status,model_alias}   counter
#   ai_task_duration_seconds{task_type}           histogram
#   ai_task_cost_usd_total{workspace_id?}         counter
#   ai_guardrail_block_total{layer,rule}          counter
#   ai_tool_call_total{tool,outcome}              counter

groups:
  - name: ai-health
    interval: 1m
    rules:
      - alert: AiTaskFailureRateHigh
        expr: |
          sum(rate(ai_task_total{status="failed"}[15m]))
            / clamp_min(sum(rate(ai_task_total[15m])), 0.001) > 0.10
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "Более 10% AI-задач падают (15 мин)"
          runbook: "incident-playbooks.md §1 (провайдер) / §6 (structured output)"

      - alert: AiNeedsReviewSurge
        expr: |
          sum(rate(ai_task_total{status="needs_review"}[1h]))
            / clamp_min(sum(rate(ai_task_total[1h])), 0.001) > 0.05
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "Доля needs_review > 5% — деградация модели, смена промпта или атака"
          runbook: "incident-playbooks.md §3"

      # САМЫЙ НЕДООЦЕНЁННЫЙ АЛЕРТ: сломанный AI-контур чаще выглядит как ТИШИНА,
      # чем как ошибки (воркер не поднялся, секрет не задан, стоп-флаг включён).
      - alert: AiTrafficSilence
        expr: |
          sum(rate(ai_task_total[15m])) == 0
            and sum(rate(ai_task_total[1d] offset 1d)) > 0
        for: 30m
        labels: { severity: page }
        annotations:
          summary: "Ноль AI-выполнений при обычном ненулевом трафике"
          runbook: "incident-playbooks.md §8"

  - name: ai-latency
    interval: 1m
    rules:
      - alert: AiLatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum by (le, task_type) (rate(ai_task_duration_seconds_bucket[15m]))) > 24
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "p95 латентности AI-задачи {{ $labels.task_type }} вдвое выше SLO (12 с)"

  - name: ai-cost
    interval: 5m
    rules:
      - alert: AiTenantBudgetNearLimit
        # 80% дневного лимита. Лимит подставляется рекординг-правилом ai_tenant_daily_limit_usd.
        expr: |
          increase(ai_task_cost_usd_total[1d]) / clamp_min(ai_tenant_daily_limit_usd, 0.01) > 0.8
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "Тенант {{ $labels.workspace_id }} израсходовал >80% дневного AI-бюджета"
          runbook: "budgets-and-slo.md → «Деградация под лимитом»"

      - alert: AiPlatformCostSpike
        expr: |
          increase(ai_task_cost_usd_total[1d])
            > 1.5 * avg_over_time(ai_platform_daily_cost_usd[7d])
        for: 30m
        labels: { severity: page }
        annotations:
          summary: "Дневная стоимость AI выросла более чем на 50% к среднему за неделю"
          runbook: "incident-playbooks.md §2"

  - name: ai-guardrails
    interval: 1m
    rules:
      - alert: AiSecretLeakBlocked
        # Любое срабатывание фильтра утечек — инцидент, а не метрика.
        expr: increase(ai_guardrail_block_total{rule="secret_leak"}[10m]) > 0
        labels: { severity: page }
        annotations:
          summary: "Output-guardrail заблокировал утечку секрета"
          runbook: "incident-playbooks.md §4 — РОТАЦИЯ КЛЮЧА первым действием"

      - alert: AiToolDeniedSurge
        expr: |
          sum(rate(ai_tool_call_total{outcome="denied"}[15m]))
            / clamp_min(sum(rate(ai_tool_call_total[15m])), 0.001) > 0.2
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "Более 20% вызовов инструментов отклонено политикой"
          runbook: "incident-playbooks.md §7 — отличить смену политики от её недоступности"

      - alert: AiPolicyEngineDown
        # Fail-closed означает, что недоступность политики ОСТАНАВЛИВАЕТ работу — это page.
        expr: increase(ai_guardrail_block_total{rule="policy_unavailable"}[5m]) > 0
        labels: { severity: page }
        annotations:
          summary: "Движок политик недоступен — контур в fail-closed"
