# Локальная инфраструктура. В контейнерах живёт ТОЛЬКО она:
#
#   traefik    — единая точка входа, same-origin для фронта и API (§7 архитектуры)
#   postgres   — БД
#   redis      — очереди BullMQ, кэш, rate limiting
#
# Сами сервисы и фронтенд запускаются с хоста, а не в Docker:
#
#   cd backend  && bun run local:up   # инфра + миграции + все сервисы в watch-режиме
#   cd frontend && bun run dev        # Next.js на :3000
#
# Так правки подхватываются мгновенно, без пересборки образов. Контейнерный
# запуск всего стека нужен только для прода — docker-compose.prod.yml.
#
# Открывать:  http://localhost:${TRAEFIK_HTTP_PORT:-8080}
# Дашборд:    http://localhost:${TRAEFIK_DASHBOARD_PORT:-8081}

services:
  postgres:
    # pg_trgm и btree_gist входят в стандартный contrib — кастомный образ не нужен.
    # Нужны PostGIS/pgvector? Соберите свой образ и укажите его здесь (ADR-0004).
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-donbilet}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-donbilet}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devpass}
    command: >
      sh -c "redis-server --appendonly yes --save 60 1000 --requirepass $$REDIS_PASSWORD"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "${TRAEFIK_HTTP_PORT:-8080}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8081}:8080"
    volumes:
      - ./deploy/traefik/traefik.local.yml:/etc/traefik/traefik.yml:ro
      - ./deploy/traefik/dynamic:/etc/traefik/dynamic:ro
    # Traefik проксирует на процессы ХОСТА (фронт :3000, gateway :5000).
    # На Linux host.docker.internal не резолвится сам — добавляем явно.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
