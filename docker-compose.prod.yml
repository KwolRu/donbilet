# Прод/стейдж. Единый домен (тенант из JWT, без поддоменов).
# На сервере положите .env рядом с этим файлом. DATABASE_URL задаётся напрямую:
#   DATABASE_URL=postgresql://user:yourpassword@postgres:5432/__APP_SLUG__
# ВАЖНО: спецсимволы в пароле URL-кодируйте (@ → %40, # → %23 и т.д.)
# CRYPTO_KEY (32+ байта) — ключ шифрования секретов at-rest, только в .env.
# Nginx: deploy/nginx/app.conf — впишите свой server_name.
#
# По умолчанию поднимаются активные сервисы. Скелеты (billing, analytics, notification)
# — под профилем `full`: docker compose -f docker-compose.prod.yml --profile full up -d
#
# Внутренние сервисы общаются только внутри docker-сети app-network.
# Снаружи открыт только nginx.
#
# Миграции в проде — ТОЛЬКО `npm run db:migrate:deploy`, никогда `db push`.

x-backend-docker-env: &backend_docker_env
  # DATABASE_URL (владелец) и DATABASE_RUNTIME_URL (роль приложения без BYPASSRLS)
  # задаются в .env. Без второго RLS не защищает — см. ADR-0002 §3.
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  CRYPTO_KEY: ${CRYPTO_KEY}
  AUTH_SERVICE_GRPC_URL: "auth-service:51071"

x-backend-common: &backend_common
  image: ghcr.io/${GHCR_OWNER}/__APP_SLUG__-backend:${BACKEND_IMAGE_TAG:-dev}
  env_file:
    - ./.env
  restart: unless-stopped
  networks:
    - app-network
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ---- Edge ----

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/${GHCR_OWNER}/__APP_SLUG__-frontend:${FRONTEND_IMAGE_TAG:-dev}
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://gateway:5000
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Infrastructure ----

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >
      sh -c "redis-server --appendonly yes --save 60 1000 --requirepass $$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Активные бэкенд-сервисы ----

  gateway:
    <<: *backend_common
    environment:
      <<: *backend_docker_env
      SERVICE_NAME: gateway
      GATEWAY_PORT: "5000"
      AUTH_SERVICE_URL: http://auth-service:5007
      EXAMPLE_SERVICE_URL: http://example-service:5001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      example-service:
        condition: service_started
      auth-service:
        condition: service_started

  auth-service:
    <<: *backend_common
    environment:
      <<: *backend_docker_env
      SERVICE_NAME: auth
      AUTH_SERVICE_GRPC_URL: "0.0.0.0:51071"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  example-service:
    <<: *backend_common
    environment:
      <<: *backend_docker_env
      SERVICE_NAME: example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started

  # ---- Скелеты сервисов. Профиль `full`. ----

  notification-service:
    <<: *backend_common
    profiles: ["full"]
    environment:
      <<: *backend_docker_env
      SERVICE_NAME: notification
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics-service:
    <<: *backend_common
    profiles: ["full"]
    environment:
      <<: *backend_docker_env
      SERVICE_NAME: analytics
    depends_on:
      postgres:
        condition: service_healthy

  billing-service:
    <<: *backend_common
    profiles: ["full"]
    environment:
      <<: *backend_docker_env
      SERVICE_NAME: billing
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
