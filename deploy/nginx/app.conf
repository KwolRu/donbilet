# Единый домен, без поддоменов на тенант (тенант резолвится из JWT, не из Host).
# Снаружи открыт только nginx: / → frontend (Next.js SSR), /api → gateway.
# WebSocket проксируется с Upgrade — так работает и HMR в dev, и WS-эндпоинты gateway.
#
# Домен задаётся server_name — в проде подставьте свой (напр. app.__APP_DOMAIN__).
# Локально по умолчанию слушаем всё (_) на порту 80.

# WebSocket upgrade helper: Connection: upgrade только для апгрейд-запросов.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream app_frontend {
    server frontend:3000;
}

upstream app_gateway {
    server gateway:5000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # API + WebSocket
    location /api/ {
        proxy_pass http://app_gateway;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Фронтенд (Next.js), включая _next и статику
    location / {
        proxy_pass http://app_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
