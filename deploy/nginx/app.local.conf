# nginx для ЛОКАЛЬНОЙ разработки.
#
# Сам nginx в контейнере, а фронт и gateway — процессы на хосте:
#   /      → host.docker.internal:3000  (Next.js, bun run dev)
#   /api   → host.docker.internal:5000  (gateway, bun run local:up)
#
# Зачем вообще nginx локально: он даёт тот же single-origin, что и в проде.
# Фронт и API на одном host:port — httpOnly-cookies сессии работают так же,
# как на боевом домене, и `sameSite`/`secure` не приходится ослаблять.
#
# Прод-конфиг — deploy/nginx/app.conf (там upstream'ы указывают на контейнеры).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream local_frontend {
    server host.docker.internal:3000;
}

upstream local_gateway {
    server host.docker.internal:5000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Понятная ошибка вместо стандартной страницы nginx, когда процесс на хосте
    # ещё не поднят — это самая частая ситуация при старте работы.
    error_page 502 504 = @not_running;

    location @not_running {
        default_type text/plain;
        return 503 "Upstream is not running. Start it on the host:\n  cd backend  && bun run local:up\n  cd frontend && bun run dev\n";
    }

    location /api/ {
        proxy_pass http://local_gateway;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://local_frontend;
        proxy_http_version 1.1;

        # Upgrade нужен и для HMR-сокета Next.js в dev-режиме.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
